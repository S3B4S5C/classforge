spring:
  mongodb:
    uri: ${CLASSFORGE_MONGODB_URI:mongodb://localhost:27017/classforge?replicaSet=rs0}
    representation:
      uuid: standard

server:
  address: 127.0.0.1
  port: 8082
  forward-headers-strategy: framework

classforge:
  assistant:
    text:
      provider: groq
    voice:
      provider: groq
    vision:
      provider: groq
      dense-two-pass-enabled: ${CLASSFORGE_ASSISTANT_VISION_TWO_PASS:false}
      dense-hybrid:
        enabled: ${CLASSFORGE_ASSISTANT_VISION_HYBRID:true}
        min-classes: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_MIN_CLASSES:4}
        fallback-to-semantic: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_FALLBACK:false}

  security:
    jwt:
      secret: ${CLASSFORGE_JWT_SECRET}
      expiration-minutes: 480
    websocket:
      allowed-origin-patterns: ${CLASSFORGE_WEBSOCKET_ALLOWED_ORIGINS:https://*.cloudfront.net}
