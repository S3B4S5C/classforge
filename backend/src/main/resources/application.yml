spring:
  application:
    name: classforge

  datasource:
    url: jdbc:h2:file:./data/classforge
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8082
classforge:
  assistant:
    text:
      provider: ${CLASSFORGE_ASSISTANT_TEXT_PROVIDER:llama-cpp}
    llama-url: ${CLASSFORGE_ASSISTANT_LLAMA_URL:http://127.0.0.1:8092}
    llama-model: ${CLASSFORGE_ASSISTANT_LLAMA_MODEL:local-model}
    whisper-url: ${CLASSFORGE_ASSISTANT_WHISPER_URL:http://127.0.0.1:8093}
    bedrock:
      enabled: ${CLASSFORGE_BEDROCK_ENABLED:false}
      region: ${AWS_REGION:us-east-1}
      request-timeout-seconds: ${CLASSFORGE_BEDROCK_TIMEOUT_SECONDS:300}
      text-model: ${CLASSFORGE_BEDROCK_TEXT_MODEL:us.amazon.nova-2-lite-v1:0}
      vision-model: ${CLASSFORGE_BEDROCK_VISION_MODEL:us.amazon.nova-2-lite-v1:0}
      text-max-completion-tokens: ${CLASSFORGE_BEDROCK_TEXT_MAX_TOKENS:1024}
    vision:
      provider: ${CLASSFORGE_ASSISTANT_VISION_PROVIDER:llama-cpp}
      url: ${CLASSFORGE_ASSISTANT_VISION_URL:http://127.0.0.1:8094}
      model: ${CLASSFORGE_ASSISTANT_VISION_MODEL:vision-model}
      request-timeout-seconds: ${CLASSFORGE_ASSISTANT_VISION_TIMEOUT_SECONDS:180}
      max-completion-tokens: ${CLASSFORGE_ASSISTANT_VISION_MAX_TOKENS:3200}
      dense-two-pass-enabled: ${CLASSFORGE_ASSISTANT_VISION_TWO_PASS:false}
      dense-two-pass-min-classes: ${CLASSFORGE_ASSISTANT_VISION_TWO_PASS_MIN_CLASSES:4}
      relationship-max-completion-tokens: ${CLASSFORGE_ASSISTANT_VISION_RELATIONSHIP_MAX_TOKENS:1800}
      dense-hybrid:
        enabled: ${CLASSFORGE_ASSISTANT_VISION_HYBRID:true}
        min-classes: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_MIN_CLASSES:4}
        fallback-to-semantic: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_FALLBACK:false}
        localization-max-completion-tokens: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_LOCALIZATION_TOKENS:1200}
        relationship-max-completion-tokens: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_RELATIONSHIP_TOKENS:512}
        multiplicity-max-completion-tokens: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_MULTIPLICITY_TOKENS:128}

    image:
      max-bytes: 10485760
      min-dimension: 64
      max-dimension: 8192

  security:
    jwt:
      secret: ${CLASSFORGE_JWT_SECRET:classforge-development-secret-change-before-production-2026}
      expiration-minutes: 480
    websocket:
      allowed-origin-patterns: ${CLASSFORGE_WEBSOCKET_ALLOWED_ORIGINS:*}
