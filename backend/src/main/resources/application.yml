spring:
  application:
    name: classforge

  datasource:
    url: jdbc:h2:file:./data/classforge
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082
classforge:
  security:
    jwt:
      secret: ${CLASSFORGE_JWT_SECRET:classforge-development-secret-change-before-production-2026}
      expiration-minutes: 480