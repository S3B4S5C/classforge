spring:
  application:
    name: classforge
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  mongodb:
    uri: ${CLASSFORGE_MONGODB_URI:mongodb://localhost:27017/classforge?replicaSet=rs0}
    representation:
      uuid: standard

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8082
classforge:
  activity:
    sessions:
      inactivity-timeout: ${CLASSFORGE_SESSION_INACTIVITY_TIMEOUT:PT30M}
      sweep-interval: ${CLASSFORGE_SESSION_SWEEP_INTERVAL:PT1M}
      maintenance-enabled: ${CLASSFORGE_SESSION_MAINTENANCE_ENABLED:true}
  assistant:
    conversation:
      request-timeout-millis: ${CLASSFORGE_ASSISTANT_CONVERSATION_TIMEOUT_MILLIS:90000}
      max-context-chars: ${CLASSFORGE_ASSISTANT_CONVERSATION_MAX_CONTEXT_CHARS:18000}
      max-completion-tokens: ${CLASSFORGE_ASSISTANT_CONVERSATION_MAX_TOKENS:2048}
    text:
      provider: groq
    voice:
      provider: groq
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      text-model: ${GROQ_TEXT_MODEL:openai/gpt-oss-120b}
      vision-model: ${GROQ_VISION_MODEL:qwen/qwen3.8-27b}
      speech-model: ${GROQ_SPEECH_MODEL:whisper-large-v3-turbo}
      language: ${GROQ_LANGUAGE:es}
      request-timeout-millis: ${GROQ_REQUEST_TIMEOUT_MILLIS:90000}
      tool-max-completion-tokens: ${GROQ_TOOL_MAX_COMPLETION_TOKENS:2048}
    vision:
      provider: groq
      request-timeout-seconds: ${CLASSFORGE_ASSISTANT_VISION_TIMEOUT_SECONDS:180}
      max-completion-tokens: ${CLASSFORGE_ASSISTANT_VISION_MAX_TOKENS:3200}
      dense-two-pass-enabled: ${CLASSFORGE_ASSISTANT_VISION_TWO_PASS:false}
      dense-two-pass-min-classes: ${CLASSFORGE_ASSISTANT_VISION_TWO_PASS_MIN_CLASSES:4}
      relationship-max-completion-tokens: ${CLASSFORGE_ASSISTANT_VISION_RELATIONSHIP_MAX_TOKENS:1800}
      dense-hybrid:
        enabled: ${CLASSFORGE_ASSISTANT_VISION_HYBRID:true}
        min-classes: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_MIN_CLASSES:4}
        fallback-to-semantic: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_FALLBACK:false}
        localization-max-completion-tokens: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_LOCALIZATION_TOKENS:1200}
        relationship-max-completion-tokens: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_RELATIONSHIP_TOKENS:512}
        multiplicity-max-completion-tokens: ${CLASSFORGE_ASSISTANT_VISION_HYBRID_MULTIPLICITY_TOKENS:128}

    image:
      max-bytes: 10485760
      min-dimension: 64
      max-dimension: 8192

  security:
    jwt:
      secret: ${CLASSFORGE_JWT_SECRET:classforge-development-secret-change-before-production-2026}
      expiration-minutes: 480
    websocket:
      allowed-origin-patterns: ${CLASSFORGE_WEBSOCKET_ALLOWED_ORIGINS:*}
