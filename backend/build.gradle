plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
}

group = 'com.classforge'
version = '0.1.0-SNAPSHOT'
description = 'Backend and orchestration layer for ClassForge'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.auth0:java-jwt:4.6.0'
    implementation 'org.openpnp:opencv:4.9.0-0'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
}


// CU09-CAL-011: OpenCV loads packaged native libraries. Java 21 permits this,
// but future JDKs require explicit native-access opt-in; enable it for every Test task.
tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// CU08-FIX-010-ASSISTANT-E2E-RELIABILITY
tasks.register('assistantE2EReliability', Test) {
    group = 'verification'
    description = 'Runs the real Assistant HTTP endpoint repeatedly against llama.cpp and reports reliability by operation type.'

    // CU08-FIX-010-V1.3: custom Test task must be wired to the test runtime.
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // The external LLM is nondeterministic; execute the benchmark on every invocation.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.classforge.assistant.AssistantE2EReliabilityIntegrationTest'
    }

    def option = { String name, String defaultValue ->
        project.findProperty(name)?.toString() ?: defaultValue
    }

    systemProperty 'assistant.benchmark.enabled', 'true'
    systemProperty 'assistant.benchmark.attempts', option('attempts', '5')
    systemProperty 'assistant.benchmark.errorFailurePercent', option('errorFailurePercent', '60')
    systemProperty 'assistant.benchmark.verbose', option('verbose', 'false')
    systemProperty 'classforge.assistant.llama-url', option('llamaUrl', 'http://127.0.0.1:8092')
    systemProperty 'classforge.assistant.llama-model', option('model', 'local-model')

    // CU08-FIX-014-NATIVE-TOOLS-CUTOVER
    systemProperty 'assistant.benchmark.suite', option('suite', 'regression')

    def reportFile = option('reportFile', '')
    if (reportFile) {
        systemProperty 'assistant.benchmark.reportFile', reportFile
    }

    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

// C2-CU09-002-VISION-BENCHMARK
tasks.register('assistantVisionBenchmark', Test) {
    group = 'verification'
    description = 'Runs the real image->UML benchmark against the configured llama.cpp multimodal runtime.'

    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.classforge.assistant.vision.AssistantVisionBenchmarkIntegrationTest'
    }

    def option = { String name, String defaultValue ->
        project.findProperty(name)?.toString() ?: defaultValue
    }

    systemProperty 'assistant.vision.benchmark.enabled', 'true'
    systemProperty 'assistant.vision.benchmark.suite', option('visionSuite', 'regression')
    systemProperty 'assistant.vision.benchmark.attempts', option('attempts', '1')
    systemProperty 'assistant.vision.benchmark.verbose', option('verbose', 'false')
    systemProperty 'assistant.vision.benchmark.minSemanticPercent', option('minSemanticPercent', '0')
    systemProperty 'assistant.vision.benchmark.minSafetyPercent', option('minSafetyPercent', '100')
    systemProperty 'assistant.vision.benchmark.minSchemaPercent', option('minSchemaPercent', '100')
    systemProperty 'assistant.vision.benchmark.timeoutSeconds', option('timeoutSeconds', '90')
    systemProperty 'assistant.vision.benchmark.maxCompletionTokens', option('maxCompletionTokens', '2800')
    systemProperty 'assistant.vision.benchmark.twoPass', option('visionTwoPass', 'false')
    systemProperty 'assistant.vision.benchmark.relationshipMaxCompletionTokens', option('relationshipMaxCompletionTokens', '1800')
    systemProperty 'assistant.vision.benchmark.imageStrategy', option('visionImageStrategy', 'original')
    systemProperty 'assistant.vision.benchmark.hybridCv', option('visionHybridCv', 'false')
    systemProperty 'assistant.vision.benchmark.hybridGeometryOnly', option('visionHybridGeometryOnly', 'false')
    systemProperty 'assistant.vision.benchmark.hybridLocalizationTokens', option('hybridLocalizationTokens', '1200')
    systemProperty 'assistant.vision.benchmark.hybridRelationshipTokens', option('hybridRelationshipTokens', '1800')
    systemProperty 'assistant.vision.benchmark.caseFilter', option('visionCase', '')
    systemProperty 'assistant.vision.benchmark.modelLabel', option('modelLabel', option('visionModel', 'vision-model'))
    systemProperty 'classforge.assistant.vision.url', option('visionUrl', 'http://127.0.0.1:8094')
    systemProperty 'classforge.assistant.vision.model', option('visionModel', 'vision-model')

    def reportFile = option('reportFile', '')
    if (reportFile) {
        systemProperty 'assistant.vision.benchmark.reportFile', reportFile
    }

    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}


// C2-CU09-003-VISION-E2E-CLOSURE
tasks.register('assistantVisionAcceptance', Test) {
    group = 'verification'
