plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
}

group = 'com.classforge'
version = '0.1.0-SNAPSHOT'
description = 'Backend and orchestration layer for ClassForge'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.auth0:java-jwt:4.6.0'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
}

// CU08-FIX-010-ASSISTANT-E2E-RELIABILITY
tasks.register('assistantE2EReliability', Test) {
    group = 'verification'
    description = 'Runs the real Assistant HTTP endpoint repeatedly against llama.cpp and reports reliability by operation type.'

    // CU08-FIX-010-V1.3: custom Test task must be wired to the test runtime.
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // The external LLM is nondeterministic; execute the benchmark on every invocation.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.classforge.assistant.AssistantE2EReliabilityIntegrationTest'
    }

    def option = { String name, String defaultValue ->
        project.findProperty(name)?.toString() ?: defaultValue
    }

    systemProperty 'assistant.benchmark.enabled', 'true'
    systemProperty 'assistant.benchmark.attempts', option('attempts', '5')
    systemProperty 'assistant.benchmark.errorFailurePercent', option('errorFailurePercent', '60')
    systemProperty 'assistant.benchmark.verbose', option('verbose', 'false')
    systemProperty 'classforge.assistant.llama-url', option('llamaUrl', 'http://127.0.0.1:8092')
    systemProperty 'classforge.assistant.llama-model', option('model', 'local-model')

    // CU08-FIX-014-NATIVE-TOOLS-CUTOVER
    systemProperty 'assistant.benchmark.suite', option('suite', 'regression')

    def reportFile = option('reportFile', '')
    if (reportFile) {
        systemProperty 'assistant.benchmark.reportFile', reportFile
    }

    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}
