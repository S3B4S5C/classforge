    systemProperty 'assistant.vision.acceptance.enabled', 'true'
    systemProperty 'classforge.assistant.vision.url', option('visionUrl', 'http://127.0.0.1:8094')
    systemProperty 'classforge.assistant.vision.model', option('visionModel', 'vision-model')

    testLogging {
