// C7-CU18: validate representative generated Flutter Android applications.
tasks.register('generatedFlutterAcceptance', Test) {
    group = 'verification'
    description = 'Generates CU-18 SIMPLE_CRUD and AUTH_INFORMATION_SYSTEM Flutter apps and runs analyze/test/debug Android build for both.'

    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    useJUnitPlatform()
    maxParallelForks = 1
    filter {
        includeTestsMatching 'com.classforge.generation.spring.acceptance.GeneratedFlutterAcceptanceIntegrationTest'
    }

    systemProperty 'spring.flutter.acceptance.enabled', 'true'
    def flutterCommand = project.findProperty('flutterCommand')?.toString() ?: 'flutter'
    systemProperty 'spring.flutter.acceptance.command', flutterCommand

    // Windows CU-19 hardening: keep JUnit @TempDir on the repository volume.
    // Kotlin incremental caches for Flutter plugins cannot relativize source files
    // across different drive roots (for example F:\FlutterPubCache vs C:\Temp).
    def flutterAcceptanceTemp = layout.buildDirectory.dir('tmp/generated-flutter-acceptance').get().asFile
    doFirst {
        flutterAcceptanceTemp.mkdirs()
    }
    systemProperty 'java.io.tmpdir', flutterAcceptanceTemp.absolutePath

    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

