map $http_upgrade $classforge_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name __HOSTNAME__;
    location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://__HOSTNAME__$request_uri; }
}

server {
    listen 443 ssl;
    server_name __HOSTNAME__;
    ssl_certificate /etc/letsencrypt/live/__HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOSTNAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    include /etc/nginx/snippets/classforge-android*.conf;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host __HOSTNAME__;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $classforge_connection_upgrade;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host __HOSTNAME__;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
