name: Prepare or deploy Azure release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish to the existing Azure App Service (resources/settings must already exist)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLASSFORGE_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      CLASSFORGE_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Dspring.test.context.cache.maxSize=4
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx512m -Dorg.gradle.workers.max=1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start isolated Mongo replica set
        run: |
          chmod +x backend/gradlew
          docker compose -f compose.mongo.yml up -d --wait
      - name: Test and package complete application
        shell: pwsh
        run: ./scripts/azure-build-package.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: classforge-azure
          path: .azure-deploy/app.jar*
          if-no-files-found: error
          retention-days: 7
      - name: Stop test MongoDB
        if: always()
        run: docker compose -f compose.mongo.yml down --volumes

  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: classforge-azure
          path: .azure-deploy
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish verified JAR and smoke
        shell: pwsh
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          if (-not $env:AZURE_RESOURCE_GROUP -or -not $env:AZURE_WEBAPP_NAME) { throw 'Configure Azure environment variables first.' }
          ./scripts/azure-deploy.ps1 -ResourceGroup $env:AZURE_RESOURCE_GROUP -AppName $env:AZURE_WEBAPP_NAME
